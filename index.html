<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="İmtihana hazırlanan talebeler için motivasyon uygulaması" />
  <title>30 Haziran'a Kalan Süre</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="container" role="main">

    <!-- Header -->
    <header class="header">
      <h1 class="main-title">30 Haziran'a Kalan Süre</h1>
      <p class="subtitle">Bu yolda yalnız değilsin. Seninle birlikte sayanlar var.</p>
    </header>

    <!-- Countdown -->
    <section class="countdown-section" aria-label="Geri sayım">
      <div class="countdown" id="countdown">
        <div class="time-unit">
          <span class="time-value" id="days">--</span>
          <span class="time-label">Gün</span>
        </div>
        <div class="time-separator" aria-hidden="true">:</div>
        <div class="time-unit">
          <span class="time-value" id="hours">--</span>
          <span class="time-label">Saat</span>
        </div>
        <div class="time-separator" aria-hidden="true">:</div>
        <div class="time-unit">
          <span class="time-value" id="minutes">--</span>
          <span class="time-label">Dakika</span>
        </div>
        <div class="time-separator" aria-hidden="true">:</div>
        <div class="time-unit">
          <span class="time-value" id="seconds">--</span>
          <span class="time-label">Saniye</span>
        </div>
      </div>

      <!-- Celebration message (hidden until countdown ends) -->
      <div class="celebration" id="celebration" hidden aria-live="polite">
        <p class="celebration-icon" aria-hidden="true">🎉</p>
        <p class="celebration-text">Tebrikler! Bu zorlu yolculuğu tamamladın.<br>Emeğin ve sabrın meyvesini aldın.</p>
      </div>
    </section>

    <!-- Quote card -->
    <section class="quote-section" aria-label="Motivasyon mesajları" aria-live="polite">
      <div class="quote-card" id="quote-card">
        <div class="quote-inner" id="quote-inner">
          <p class="quote-text" id="quote-text">Yükleniyor…</p>
          <p class="quote-author" id="quote-author"></p>
        </div>
      </div>

      <!-- Error / empty state -->
      <p class="quote-error" id="quote-error" hidden role="alert">
        Mesajlar yüklenemedi. Lütfen sayfayı yenileyin.
      </p>
      <p class="quote-empty" id="quote-empty" hidden>
        Henüz eklenmiş mesaj yok.
      </p>
    </section>

    <!-- Navigation controls -->
    <nav class="controls" aria-label="Mesaj gezinme kontrolleri">
      <button class="btn-nav" id="btn-prev" aria-label="Önceki mesaj" title="Önceki (←)">
        <span aria-hidden="true">&#8592;</span>
      </button>
      <span class="message-counter" id="message-counter" aria-live="polite"></span>
      <button class="btn-nav" id="btn-next" aria-label="Sonraki mesaj" title="Sonraki (→)">
        <span aria-hidden="true">&#8594;</span>
      </button>
    </nav>

  </main>

  <script src="script.js"></script>
</body>
</html>
